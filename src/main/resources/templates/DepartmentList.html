<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Payroll System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Application CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<!-- Navigation Bar -->
<!--div th:replace="~{fragments/navbar :: navbar}"></div-->

<!-- Main Content -->
<main class="container-fluid dashboard-container">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Department List</h2>
        <a th:href="@{/department/new}" class="btn btn-info">
            Create Department
        </a>
    </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered">
                <thead class="table-dark">
                <tr>
                    <th>Department Name</th>
                    <th>Department Code</th>
                    <th>Cost Center</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="department : ${departments}">
                    <td th:text="${department.departmentName}"></td>
                    <td th:text="${department.departmentCode}"></td>
                    <td th:text="${department.costCenter}"></td>
                    <td>
                        <a th:href="@{/department/edit/{id}(id=${department.id})}"
                           class="btn btn-primary btn-sm">Edit</a>
                    </td>

                </tr>
                </tbody>
            </table>
        </div>

    </div>
</main>
</body>
