<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Payroll System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<main class="container-fluid dashboard-container">

    <div class="container mt-4">

        <div class="card shadow-sm">

            <div class="card-header">
                <h5>Payroll Record Create</h5>
            </div>

            <div class="card-body">

                <form th:action="@{/payrollrecord/save}"
                      method="post"
                      th:object="${payrollrecord}">

                    <!-- Hidden fields -->
                    <input type="hidden" id="empId" name="employeeId">
                    <input type="hidden" id="payRateId" name="payRateId">

                    <!-- Employee selection -->
                    <div class="mb-3">

                        <label class="form-label">Select an Employee</label>

                        <div class="input-group">

                            <input type="text"
                                   id="empName"
                                   class="form-control"
                                   placeholder="Select an Employee"
                                   readonly>

                            <button type="button"
                                    class="btn btn-outline-primary"
                                    onclick="openEmployeeWindow()">
                                Select
                            </button>

                        </div>
                    </div>

                    <!-- Pay information -->
                    <div class="row mb-3">

                        <div class="col-md-6">

                            <label class="form-label">Pay Type</label>

                            <input type="text"
                                   id="payType"
                                   class="form-control"
                                   readonly>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">Base Rate</label>

                            <input type="text"
                                   id="baseRate"
                                   class="form-control"
                                   readonly>

                        </div>

                    </div>

                    <!-- Pay date -->
                    <div class="mb-3">

                        <label class="form-label">Pay Date</label>

                        <input type="date"
                               th:value="${currentPayPeriod.payDate}"
                               class="form-control"
                               readonly>

                        <input type="hidden"
                               id="payPeriodId"
                               name="payPeriodId"
                               th:value="${currentPayPeriod.id}">

                    </div>

                    <!-- Hourly fields -->
                    <div id="hourlyFields" style="display: none;">

                        <div class="mb-3">

                            <label class="form-label">Regular Hours</label>

                            <input type="number"
                                   th:field="*{regularHours}"
                                   class="form-control"
                                   min="0"
                                   step="1">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Overtime Hours</label>

                            <input type="number"
                                   th:field="*{overtimeHours}"
                                   class="form-control"
                                   min="0"
                                   step="1">

                        </div>

                    </div>

                    <!-- Tax amount -->
                    <div class="mb-3">

                        <label class="form-label">Tax Amount</label>

                        <input type="number"
                               th:field="*{taxAmount}"
                               step="0.01"
                               min="0"
                               class="form-control">

                    </div>

                    <!-- Other deductions -->
                    <div class="mb-3">

                        <label class="form-label">Other Deductions</label>

                        <input type="number"
                               th:field="*{otherDeductions}"
                               step="0.01"
                               min="0"
                               class="form-control">

                    </div>

                    <button type="submit" class="btn btn-primary">
                        Save
                    </button>

                </form>

            </div>
        </div>

    </div>

</main>

<script>

    function openEmployeeWindow() {

        window.open(
            '/payrollrecord/select-employee',
            'search-employee-payrate',
            'width=1000,height=650'
        );

    }

    // Called by the child window
    function setEmployee(empId, empFullName, payRateId, payType, baseRate) {

        document.getElementById('empId').value = empId;

        document.getElementById('empName').value = empFullName;

        document.getElementById('payRateId').value = payRateId;

        document.getElementById('payType').value = payType;

        document.getElementById('baseRate').value = baseRate;

        document.getElementById('hourlyFields').style.display =
            payType === 'Hourly' ? 'block' : 'none';

    }

</script>

</body>
</html>
