<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><!DOCTYPE html>
        <html lang="en" xmlns:th="http://www.thymeleaf.org">
        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Employee Payroll System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Application CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<!-- Navigation Bar -->
<!--div th:replace="~{fragments/navbar :: navbar}"></div-->

<!-- Main Content -->
<main class="container-fluid dashboard-container">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mb-0">Employee List</h2>
            <a th:href="@{/employee/new}" class="btn btn-info">
                Create Employee
            </a>
        </div>

        <div class="table-responsive">

            <table class="table table-striped table-hover table-bordered">
                <thead class="table-dark">
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Hire Date</th>
                    <th>Is Acitive</th>
                    <th> Edit</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="emp :${employees}">
                    <form method="post" th:action="@{/employee/delete/{id}(id=${emp.id})}">
                        <td  th:text="${emp.firstName}"></td>
                        <td th:text="${emp.lastName}"></td>
                        <td th:text="${emp.email}"></td>
                        <td th:th:text="${emp.hireDate}"></td>
                        <td th:text="${emp.isActive ? 'Active' : 'Inactive'}"></td>
                        <td>
                            <a th:href="@{/employee/edit/{id}(id=${emp.id})}">Edit</a>&nbsp;
                            <button id="deleteEmp" type="submit" class="btn btn-secondary">Delete</button>
                        </td>
                    </form>
                </tr>

                </tbody>
            </table>

            <!-- Pagination -->
            <div class="d-flex justify-content-between align-items-center mt-3">

                <div>
                    Showing
                    <span th:text="${employeePage.numberOfElements}"></span>
                    of
                    <span th:text="${employeePage.totalElements}"></span>
                    employees

                    (Page
                    <span th:text="${employeePage.number + 1}"></span>
                    of
                    <span th:text="${employeePage.totalPages}"></span>)
                </div>

                <nav>
                    <ul class="pagination mb-0">

                        <!-- Previous -->
                        <li class="page-item"
                            th:classappend="${employeePage.first} ? 'disabled'">

                            <a class="page-link"
                               th:href="@{/employee/list(page=${employeePage.number - 1})}">
                                Previous
                            </a>
                        </li>

                        <!-- Page Numbers -->
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, employeePage.totalPages - 1)}"
                            th:classappend="${i == employeePage.number} ? 'active'">

                            <a class="page-link"
                               th:href="@{/employee/list(page=${i})}"
                               th:text="${i + 1}">
                            </a>
                        </li>

                        <!-- Next -->
                        <li class="page-item"
                            th:classappend="${employeePage.last} ? 'disabled'">

                            <a class="page-link"
                               th:href="@{/employee/list(page=${employeePage.number + 1})}">
                                Next
                            </a>
                        </li>

                    </ul>
                </nav>

            </div>



        </div>
    </div>

    <script>
        const deleteButtons = document.querySelectorAll("#deleteEmp");

        deleteButtons.forEach(button => {
            button.addEventListener("click", function(e) {

                const isDelete = confirm("Are you sure you want to delete this record?");

                if (!isDelete) {
                    e.preventDefault();
                }
            });
        });
    </script>

</main>
</body>
</html></title>
</head>
<body>

</body>
</html>
