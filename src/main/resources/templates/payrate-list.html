<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Payroll System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Application CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<!-- Navigation Bar -->
<!--div th:replace="~{fragments/navbar :: navbar}"></div-->

<!-- Main Content -->
<main class="container-fluid dashboard-container">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mb-0">Payroll Period List</h2>
            <a th:href="@{/payrate/new}" class="btn btn-info">
                Create Payrate
            </a>
        </div>


        <div class="card mb-4">
            <div class="card-body">

                <form method="get" th:action="@{/payrate/list}">

                    <div class="row g-3 align-items-end">

                        <!-- Date From -->
                        <div class="col-md-2">
                            <label class="form-label">First Name:</label>
                            <input type="text"
                                   name="firstName"
                                   th:value="${firstName}"
                                   class="form-control">
                        </div>

                        <!-- Date To -->
                        <div class="col-md-2">
                            <label class="form-label">Last Name:</label>
                            <input type="text"
                                   name="lastName"
                                   th:value="${lastName}"
                                   class="form-control">
                        </div>

                        <!-- Department -->
                        <div class="col-md-3">
                            <label class="form-label">Department:</label>
                            <select name="departmentId" class="form-select">
                                <option value="">All Departments</option>

                                <option th:each="dept : ${departments}"
                                        th:value="${dept.id}"
                                        th:text="${dept.departmentName}"
                                        th:selected="${departmentId != null and departmentId == dept.id}">
                                </option>
                            </select>
                        </div>

                        <!-- Buttons -->
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary">
                                Search
                            </button>

                            <a th:href="@{/employee/list}"
                               class="btn btn-secondary">
                                Clear
                            </a>
                        </div>

                    </div>

                </form>

            </div>
        </div>


        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered">
                <thead class="table-dark">
                <tr>
                    <th>Employee Name</th>
                    <th> Department Code</th>
                    <th>Pay Type</th>
                    <th>Base Rate</th>
                    <th>Effective Date</th>
                    <th>End Date</th>
                    <th>Edit</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each = "item : ${payratelist}">
                    <td th:text="${item.fullName}"></td>
                    <td th:text="${item.departmentCode}"></td>
                    <td th:text="${item.payType}"></td>
                    <td th:text="${item.baseRate}"></td>
                    <td th:text="${item.effectiveDate}"></td>
                    <td th:text="${item.endDate != null ? item.endDate : ''}"></td>
                    <td>
                        <a th:href="@{/payrate/edit/{id}(id=${item.id})}"
                           class="btn btn-primary btn-sm">Edit</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
